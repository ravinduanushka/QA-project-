name: EC4206 QA Automation & CI Pipeline

on:
  push:
    branches: [ main, member1-automation-cicd-sonar ]
  pull_request:
    branches: [ main ]

jobs:
  backend-api-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm install

      - name: Security Dependency Audit (SCA)
        working-directory: ./server
        run: npm audit --audit-level=critical || true

      - name: Run Automated API Tests with Coverage
        working-directory: ./server
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/cylixlab_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm test

      - name: Upload Interactive HTML QA Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ec4206-html-qa-report
          path: server/coverage/qa-test-report.html

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ravinduanushka
            -Dsonar.projectKey=ravinduanushka_QA-project